name: Elektron Windows artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/md-mm-*"
    paths:
      - ".github/workflows/elektron-windows.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "base.cmake"
      - "scripts/windows/build_mdmm.ps1"
      - "source/3rdparty/**"
      - "source/CMakeLists.txt"
      - "source/JUCE"
      - "source/baseLib/**"
      - "source/bridge/**"
      - "source/dsp56300"
      - "source/dsp56300/**"
      - "source/elektron/CMakeLists.txt"
      - "source/elektron/md/**"
      - "source/hardwareLib/**"
      - "source/jucePluginData/**"
      - "source/jucePluginEditorLib/**"
      - "source/jucePluginLib/**"
      - "source/juceRmlPlugin/**"
      - "source/juceRmlUi/**"
      - "source/juceUiLib/**"
      - "source/libresample/**"
      - "source/mc68k"
      - "source/mc68k/**"
      - "source/mcpServerLib/**"
      - "source/networkLib/**"
      - "source/pluginTester/**"
      - "source/ptypes/**"
      - "source/synthLib/**"

permissions:
  contents: read

concurrency:
  group: elektron-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 VST3 and Standalone
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: "mdmm-v1-windows-x64-msvc"
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.16.0

      - name: Configure and compile MD/MM
        shell: pwsh
        run: >-
          ./scripts/windows/build_mdmm.ps1
          -SourceDir "${{ github.workspace }}"
          -BuildDir "${{ runner.temp }}\gearmulator-elektron-build"
          -OutputDir "${{ github.workspace }}\artifacts\windows-mdmm"
          -Configuration Release
          -Parallel 4
          -Generator "Ninja Multi-Config"
          -CompilerLauncher sccache
          -WithTests
          -BuildOnly

      - name: Test and package MD/MM
        shell: pwsh
        run: >-
          ./scripts/windows/build_mdmm.ps1
          -SourceDir "${{ github.workspace }}"
          -BuildDir "${{ runner.temp }}\gearmulator-elektron-build"
          -OutputDir "${{ github.workspace }}\artifacts\windows-mdmm"
          -Configuration Release
          -Parallel 4
          -WithTests
          -TestOnly

      - name: Upload tester package and receipt
        uses: actions/upload-artifact@v4
        with:
          name: Gearmulator-Elektron-Windows-x64-${{ github.sha }}
          path: artifacts/windows-mdmm/*
          if-no-files-found: error
          retention-days: 14
