name: MD/MM core

on:
  workflow_dispatch:
  push:
    branches:
      - release/md-mm-public-alpha-20260826
    paths:
      - ".github/workflows/mdmm-core.yml"
      - "source/cmake/base.cmake"
      - "source/3rdparty/libresample/**"
      - "source/elektron/md/**"
      - "source/framework/hardwareLib/**"
      - "source/framework/juce/jucePluginLib/**"
      - "source/framework/synthLib/**"
      - "source/cpu/mc68k"
      - "source/cpu/dsp56300"
  pull_request:
    paths:
      - ".github/workflows/mdmm-core.yml"
      - "source/cmake/base.cmake"
      - "source/3rdparty/libresample/**"
      - "source/elektron/md/**"
      - "source/framework/hardwareLib/**"
      - "source/framework/juce/jucePluginLib/**"
      - "source/framework/synthLib/**"
      - "source/cpu/mc68k"
      - "source/cpu/dsp56300"

permissions:
  contents: read

concurrency:
  group: mdmm-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Core and synthetic workload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_options: ""
          - os: macos-14
            platform_options: "-DCMAKE_OSX_ARCHITECTURES=arm64"
          - os: windows-2022
            platform_options: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux plugin dependencies
        if: runner.os == 'Linux'
        run: sudo apt update && sudo apt install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Configure portable tests
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DGEARMULATOR_MD_BUILD_PROFILE_WORKLOAD=ON
          -Dgearmulator_BUILD_JUCEPLUGIN=ON
          -Dgearmulator_SYNTH_ELEKTRON=ON
          -Dgearmulator_SYNTH_OSIRUS=OFF
          -Dgearmulator_SYNTH_OSTIRUS=OFF
          -Dgearmulator_SYNTH_VAVRA=OFF
          -Dgearmulator_SYNTH_XENIA=OFF
          -Dgearmulator_SYNTH_NODALRED2X=OFF
          -Dgearmulator_SYNTH_JE8086=OFF
          ${{ matrix.platform_options }}

      - name: Build portable tests
        run: >-
          cmake --build build --config Release --parallel 3
          --target dsp56kTestRunner mdLibTest mdFlashTest mdProfileWorkload mdAudioIoLayoutTest

      - name: Build AMD flash regression test
        if: runner.os != 'Windows'
        run: >-
          cmake --build build --config Release --parallel 3
          --target am29fTest

      - name: Build AMD flash regression test (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake --build build --config Release --parallel 3
          --target source/framework/hardwareLib/am29fTest

      - name: Build ColdFire divide regression test
        if: runner.os != 'Windows'
        run: >-
          cmake --build build --config Release --parallel 3
          --target mc68kColdFireDivideTest

      - name: Build ColdFire divide regression test (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake --build build --config Release --parallel 3
          --target source/cpu/mc68k/mc68kColdFireDivideTest

      - name: Run portable tests
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          --tests-regex "^(dsp56300_unitTests|mc68kColdFireDivideTest|am29fTest|mdLibTests|mdFlashTest|mdAudioIoLayoutTest|mdProfileWorkload(Bounded)?Tests)$"

  apple-pgo:
    name: Apple PGO generate and use
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure profile generation
        run: >-
          cmake -S . -B build-generate
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DBUILD_TESTING=ON
          -DGEARMULATOR_MD_BUILD_PROFILE_WORKLOAD=ON
          -DGEARMULATOR_APPLE_PGO_MODE=generate
          -Dgearmulator_BUILD_JUCEPLUGIN=OFF
          -Dgearmulator_SYNTH_ELEKTRON=ON
          -Dgearmulator_SYNTH_OSIRUS=OFF
          -Dgearmulator_SYNTH_OSTIRUS=OFF
          -Dgearmulator_SYNTH_VAVRA=OFF
          -Dgearmulator_SYNTH_XENIA=OFF
          -Dgearmulator_SYNTH_NODALRED2X=OFF
          -Dgearmulator_SYNTH_JE8086=OFF

      - name: Build instrumented workload
        run: >-
          cmake --build build-generate --config Release --parallel 3
          --target mdProfileWorkload

      - name: Generate and merge profile
        env:
          LLVM_PROFILE_FILE: ${{ runner.temp }}/mdmm-%p.profraw
        run: |
          ./build-generate/source/elektron/md/mdLib/mdProfileWorkload 44100 both
          xcrun llvm-profdata merge \
            -output="${{ runner.temp }}/mdmm.profdata" \
            "${{ runner.temp }}"/mdmm-*.profraw

      - name: Configure profile use
        run: >-
          cmake -S . -B build-use
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DBUILD_TESTING=ON
          -DGEARMULATOR_MD_BUILD_PROFILE_WORKLOAD=ON
          -DGEARMULATOR_APPLE_PGO_MODE=use
          -DGEARMULATOR_APPLE_PGO_PROFILE=${{ runner.temp }}/mdmm.profdata
          -Dgearmulator_BUILD_JUCEPLUGIN=OFF
          -Dgearmulator_SYNTH_ELEKTRON=ON
          -Dgearmulator_SYNTH_OSIRUS=OFF
          -Dgearmulator_SYNTH_OSTIRUS=OFF
          -Dgearmulator_SYNTH_VAVRA=OFF
          -Dgearmulator_SYNTH_XENIA=OFF
          -Dgearmulator_SYNTH_NODALRED2X=OFF
          -Dgearmulator_SYNTH_JE8086=OFF

      - name: Build and test profile use
        run: |
          cmake --build build-use --config Release --parallel 3 \
            --target mdLibTest mdProfileWorkload
          ctest --test-dir build-use -C Release --output-on-failure \
            --tests-regex "^(mdLibTests|mdProfileWorkload(Bounded)?Tests)$"
