name: Elektron macOS universal artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/md-mm-*"
    paths:
      - ".github/workflows/elektron-macos.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "base.cmake"
      - "scripts/macos/**"
      - "source/3rdparty/**"
      - "source/CMakeLists.txt"
      - "source/3rdparty/JUCE"
      - "source/framework/baseLib/**"
      - "source/framework/tools/bridge/**"
      - "source/cpu/dsp56300"
      - "source/cpu/dsp56300/**"
      - "source/elektron/CMakeLists.txt"
      - "source/elektron/md/**"
      - "source/framework/hardwareLib/**"
      - "source/framework/juce/jucePluginData/**"
      - "source/framework/juce/jucePluginEditorLib/**"
      - "source/framework/juce/jucePluginLib/**"
      - "source/framework/juce/juceRmlPlugin/**"
      - "source/framework/juce/juceRmlUi/**"
      - "source/framework/juce/juceUiLib/**"
      - "source/3rdparty/libresample/**"
      - "source/cpu/mc68k"
      - "source/cpu/mc68k/**"
      - "source/framework/juce/mcpServerLib/**"
      - "source/framework/networkLib/**"
      - "source/framework/tools/pluginTester/**"
      - "source/3rdparty/ptypes/**"
      - "source/framework/synthLib/**"

permissions:
  contents: read

concurrency:
  group: elektron-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS universal VST3, AU, and Standalone
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Test macOS release tooling
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          /bin/bash -n scripts/macos/build_mdmm.sh scripts/macos/verify_mdmm_package.sh
          python3 scripts/macos/test_write_mdmm_receipt.py
          python3 scripts/macos/test_check_mdmm_core_capacity.py

      - name: Build, test, sign, and package MD/MM
        env:
          # Hosted runners have no secure firmware-fixture channel. Local
          # release verification defaults to requiring both validated images.
          GEARMULATOR_REQUIRE_FIRMWARE_TESTS: "0"
          # CI always exercises the reproducible universal baseline. A local
          # single-architecture PGO candidate must opt in with a matched profile.
          GEARMULATOR_MDMM_MACOS_ARCHITECTURES: "arm64;x86_64"
          GEARMULATOR_MDMM_APPLE_PGO_MODE: "none"
        run: >-
          ./scripts/macos/build_mdmm.sh
          "${{ github.workspace }}"
          "${{ runner.temp }}/gearmulator-elektron-build"
          "${{ github.workspace }}/artifacts/macos-mdmm"

      # The fixture-free CI package remains on the ephemeral runner. Release
      # artifacts come only from a local run with both pinned firmware images.
