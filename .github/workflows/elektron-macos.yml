name: Elektron macOS universal artifacts

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/md-mm-*"
    paths:
      - ".github/workflows/elektron-macos.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "base.cmake"
      - "scripts/macos/**"
      - "source/3rdparty/**"
      - "source/CMakeLists.txt"
      - "source/JUCE"
      - "source/baseLib/**"
      - "source/bridge/**"
      - "source/dsp56300"
      - "source/dsp56300/**"
      - "source/elektron/CMakeLists.txt"
      - "source/elektron/md/**"
      - "source/hardwareLib/**"
      - "source/jucePluginData/**"
      - "source/jucePluginEditorLib/**"
      - "source/jucePluginLib/**"
      - "source/juceRmlPlugin/**"
      - "source/juceRmlUi/**"
      - "source/juceUiLib/**"
      - "source/libresample/**"
      - "source/mc68k"
      - "source/mc68k/**"
      - "source/mcpServerLib/**"
      - "source/networkLib/**"
      - "source/pluginTester/**"
      - "source/ptypes/**"
      - "source/synthLib/**"

permissions:
  contents: read

concurrency:
  group: elektron-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS universal VST3, AU, and Standalone
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Test macOS release tooling
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          /bin/bash -n scripts/macos/build_mdmm.sh scripts/macos/verify_mdmm_package.sh
          python3 scripts/macos/test_write_mdmm_receipt.py

      - name: Build, test, sign, and package MD/MM
        env:
          # Hosted runners have no secure firmware-fixture channel. Local
          # release verification defaults to requiring both validated images.
          GEARMULATOR_REQUIRE_FIRMWARE_TESTS: "0"
        run: >-
          ./scripts/macos/build_mdmm.sh
          "${{ github.workspace }}"
          "${{ runner.temp }}/gearmulator-elektron-build"
          "${{ github.workspace }}/artifacts/macos-mdmm"

      # The fixture-free CI package remains on the ephemeral runner. Release
      # artifacts come only from a local run with both pinned firmware images.
